<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shifting Day</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2A2140; overflow: hidden; }
      #game { width: 100%; height: 100%; }
      /* A phone held upright gets a tiny letterboxed game: ask for it turned sideways instead. */
      #turn { display: none; position: fixed; inset: 0; z-index: 10; background: #0A0712; color: #F6EBDD; font: 700 15px/1.6 "Space Mono", monospace; letter-spacing: 4px; text-align: center; align-items: center; justify-content: center; flex-direction: column; gap: 18px; }
      #turn b { font: 400 54px/1 Anton, Impact, sans-serif; letter-spacing: 2px; }
      #turn i { width: 40px; height: 64px; border: 3px solid #FF8A4C; border-radius: 8px; animation: turn 2.4s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #turn { display: flex; } }
    </style>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div id="game"></div>
    <div id="turn"><i></i><b>SHIFTING DAY</b>TURN YOUR PHONE SIDEWAYS</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
